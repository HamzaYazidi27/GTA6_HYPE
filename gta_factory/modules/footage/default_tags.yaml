# Built-in footage concepts: what the narration can talk about AND a viewer can see.
#
#   say:   words or phrases in the narration that call for this footage (any of them)
#   look:  what it looks like, for the local vision tagger (`python -m gta_factory footage autotag`)
#   files: file-name patterns that always carry this concept (a trailer's YouTube id, "trailer 3"...)
#   also:  related concepts to fall back on when the library has nothing for this one
#
# Add your own concepts (new characters, places, vehicles...) in knowledge/footage_tags.yaml:
# same format, the two files are merged. Any tag you put on a file also works on its own:
# a screenshot tagged "flamingo" is shown whenever the narration says "flamingo".

# ------------------------------------------------------------------ characters (rockstargames.com/VI)
lucia:
  say: ["lucia", "lucia caminos", "caminos"]
  look: "Lucia Caminos, the female lead: a young Latina woman with long dark hair, often tied back"
jason:
  say: ["jason", "jason duval", "duval"]
  look: "Jason Duval, the male lead: a white man in his thirties with short brown hair and stubble"
duo:
  say: ["the duo", "the couple", "both protagonists", "the protagonists", "two protagonists", "bonnie and clyde", "jason and lucia", "lucia and jason"]
  look: "Lucia and Jason together in the same shot (a man and a woman side by side)"
  also: [lucia, jason]
cal_hampton:
  say: ["cal hampton", "cal"]
  look: "Cal Hampton: a heavy-set bearded man, conspiracy-minded friend of Jason"
boobie_ike:
  say: ["boobie ike", "boobie"]
  look: "Boobie Ike: a Black man, local businessman with a strip club and a recording studio"
drequan_priest:
  say: ["dre'quan priest", "dre'quan", "drequan", "only raw records"]
  look: "Dre'Quan Priest: a young Black man, music label owner"
real_dimez:
  say: ["real dimez", "bae-luxe", "roxy"]
  look: "Real Dimez: two young women, rap duo and social media stars"
raul_bautista:
  say: ["raul bautista", "raul"]
  look: "Raul Bautista: an older man with grey hair, a seasoned bank robber"
brian_heder:
  say: ["brian heder", "brian"]
  look: "Brian Heder: an older white man with a moustache, a drug runner in the Keys"

