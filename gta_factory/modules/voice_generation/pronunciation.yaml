# Pronunciation lexicon applied to the text sent to the voice engine only
# (subtitles and on-screen text keep the original spelling).
# Ordered list of [regex, replacement]. Python `re` syntax, case-sensitive unless (?i) is used.
rules:
  # --- money and units ---------------------------------------------------------
  - ['\$(\d[\d,]*(?:\.\d+)?)\s*(billion|million|trillion|thousand)\b', '\1 \2 dollars']
  - ['\$(\d[\d,]*(?:\.\d+)?)([BMK])\b', '\1\2 dollars']
  - ['\$(\d[\d,]*)\.(\d\d)\b', '\1 dollars \2']
  - ['\$(\d[\d,]*(?:\.\d+)?)', '\1 dollars']
  - ['(\d)\s?%', '\1 percent']
  - ['(\d)B dollars', '\1 billion dollars']
  - ['(\d)M dollars', '\1 million dollars']
  - ['(\d)K dollars', '\1 thousand dollars']
  - ['\b(\d+)\s?GB\b', '\1 gigabytes']
  - ['\b(\d+)\s?fps\b', '\1 frames per second']
  - ['\b4K\b', 'four K']
  # --- franchise terms ---------------------------------------------------------
  - ['\bGrand Theft Auto VI\b', 'Grand Theft Auto Six']
  - ['\bGrand Theft Auto V\b', 'Grand Theft Auto Five']
  - ['\bGrand Theft Auto IV\b', 'Grand Theft Auto Four']
  - ['\bGTA\s?VI\b', 'G T A Six']
  - ['\bGTA\s?6\b', 'G T A Six']
  - ['\bGTA\s?V\b', 'G T A Five']
  - ['\bGTA\s?5\b', 'G T A Five']
  - ['\bGTA\s?IV\b', 'G T A Four']
  - ['\bGTA\s?4\b', 'G T A Four']
  - ['\bGTA\b', 'G T A']
  - ['\bRDR\s?2\b', 'Red Dead Redemption Two']
  - ['\bLeonida\b', 'Lee-oh-needa']
  - ['\bZelnick\b', 'Zell-nick']
  - ['\bCaminos\b', 'Cah-mee-nos']
  - ['\bDuval\b', 'Doo-vahl']
  # --- platforms and industry ---------------------------------------------------
  - ['\bPS5 Pro\b', 'P S Five Pro']
  - ['\bPS5\b', 'P S Five']
  - ['\bPS4\b', 'P S Four']
  - ['\bXbox Series X\|S\b', 'Xbox Series X and S']
  - ['\bXbox Series X/S\b', 'Xbox Series X and S']
  - ['\bNPCs\b', 'N P Cs']
  - ['\bNPC\b', 'N P C']
  - ['\bDLC\b', 'D L C']
  - ['\bIGN\b', 'I G N']
  - ['\bVGC\b', 'V G C']
  - ['\bCEO\b', 'C E O']
  - ['\bCFO\b', 'C F O']
  - ['\bFY\s?(\d{2,4})\b', 'fiscal year \1']
  - ['\bQ([1-4])\b', 'Q \1']
  - ['\bAAA\b', 'triple A']
  - ['\bRAGE\b', 'Rage']
  - ['\bvs\.?\b', 'versus']
  - ['\be\.g\.', 'for example']
  # --- typography the engine should not read ------------------------------------
  - ['[“”"]', '']
  - ['\s[–—-]\s', ', ']
  - ['…', '.']
