# GTA 6 Video Factory - main configuration.
# Secrets never go in this file: put them in .env (see .env.example).
# Every value here has a built-in default, so you can delete what you do not change.

channel:
  name: "Ghost Plates"             # shown in the thumbnails, the end screen and the dashboard
  tagline: "Run the plates on GTA 6."
  logo: "assets/brand/logo.png"    # round logo (transparent PNG): watermark of every video, end screen, thumbnails.
                                   # Change it with `python -m gta_factory brand <image>`; "" = no logo
  watermark_opacity: 0.92          # 0.2 (discreet) .. 1.0 (solid)
  language: "en"
  playlist_prefix: "GTA 6"

# ---------------------------------------------------------------------------
# Provider adapters (swap any of them without touching the pipeline)
# ---------------------------------------------------------------------------
providers:
  llm:
    # ollama      = FREE, 100 % local open-weight model (no account, no key, no subscription). Default.
    # claude_code = optional: a Claude subscription through the Claude Code CLI (`claude -p`).
    # anthropic / openai = optional: paid API keys from .env.
    default: "ollama"
    ollama:
      host: "http://127.0.0.1:11434"
      model: "auto"                 # auto = best model for this machine's RAM (qwen3:32b / 30b / 14b / 8b / 4b); or any tag from ollama.com/library
      context_tokens: 32768         # upper bound; each request uses the smallest window that fits
      temperature: 0.5
      think: false                  # true = let hybrid "thinking" models reason first (slower, sometimes better)
      keep_alive: "15m"             # keep the model in memory between the steps of a job
      timeout_seconds: 900          # max wait between two streamed tokens
    claude_code:
      binary: "claude"
      model: ""                     # empty = the CLI's default model
      timeout_seconds: 1200
    anthropic:
      model: "claude-opus-5-5"
      effort: "high"
      max_tokens: 32000
    openai:
      model: "gpt-5"
      base_url: ""                  # set for OpenAI-compatible gateways
      max_tokens: 16000
  tts:
    default: "kokoro"
    kokoro:
      voice: "am_michael"           # run `python -m gta_factory voices` for the list
      speed: 1.04
      model_path: "assets/models/kokoro-v1.0.onnx"
      voices_path: "assets/models/voices-v1.0.bin"
    elevenlabs:
      voice_id: ""                  # a voice you own or are licensed to use
      model: "eleven_multilingual_v2"
      stability: 0.45
      similarity_boost: 0.8
      style: 0.25
    openai:
      model: "gpt-4o-mini-tts"
      voice: "ash"
      instructions: "Native American English speaker. A relaxed, confident YouTube gaming narrator talking to a friend who loves GTA: natural rhythm and pauses, light emphasis on the key words, a hint of excitement on surprising facts. Never an announcer voice, never shouting."
  search:
    # order matters: site feeds are first-party RSS, the news RSS engines widen the net
    providers: ["site_feeds", "bing_news_rss", "google_news_rss"]
    max_results_per_query: 8
    max_corroborating_articles: 6
    request_timeout_seconds: 25
  stock:
    # optional licensed b-roll; only used when a key is present in .env
    pexels: {enabled: true}
    pixabay: {enabled: true}

# ---------------------------------------------------------------------------
# Source reliability tiers used by the fact checker
# ---------------------------------------------------------------------------
sources:
  primary:
    - rockstargames.com
    - take2games.com
    - ir.take2games.com
    - support.rockstargames.com
    - sec.gov
    - blog.playstation.com
    - news.xbox.com
  secondary:
    - ign.com
    - gamespot.com
    - videogameschronicle.com
    - eurogamer.net
    - pcgamer.com
    - kotaku.com
    - gamesradar.com
    - polygon.com
    - theverge.com
    - gamesindustry.biz
    - bloomberg.com
    - reuters.com
    - bbc.com
    - bbc.co.uk
    - variety.com
    - venturebeat.com
    - gamesbeat.com
    - pushsquare.com
    - purexbox.com
    - rockpapershotgun.com
    - gameinformer.com
    - engadget.com
    - arstechnica.com
    - techradar.com
    - windowscentral.com
    - forbes.com
    - cnbc.com
    - wsj.com
    - nytimes.com
    - theguardian.com
    - insider-gaming.com
  feeds:
    - {name: "IGN", url: "https://feeds.feedburner.com/ign/all"}
    - {name: "GameSpot", url: "https://www.gamespot.com/feeds/news/"}
    - {name: "VGC", url: "https://www.videogameschronicle.com/feed/"}
    - {name: "Eurogamer", url: "https://www.eurogamer.net/feed"}
    - {name: "PC Gamer", url: "https://www.pcgamer.com/rss/"}
    - {name: "Kotaku", url: "https://kotaku.com/rss"}
    - {name: "GamesRadar", url: "https://www.gamesradar.com/feeds.xml"}

# ---------------------------------------------------------------------------
# Editorial formats (durations in seconds of narration)
# ---------------------------------------------------------------------------
formats:
  long:      {label: "Long-form news",   aspect: "16:9", target_seconds: 480, min_seconds: 360, max_seconds: 600}
  breaking:  {label: "Breaking news",    aspect: "16:9", target_seconds: 240, min_seconds: 150, max_seconds: 330}
  announcement: {label: "Major announcement", aspect: "16:9", target_seconds: 540, min_seconds: 420, max_seconds: 720}
  recap:     {label: "Weekly recap",     aspect: "16:9", target_seconds: 540, min_seconds: 420, max_seconds: 720}
  analysis:  {label: "Feature analysis", aspect: "16:9", target_seconds: 540, min_seconds: 420, max_seconds: 720}
  guide:     {label: "Guide / explainer", aspect: "16:9", target_seconds: 510, min_seconds: 360, max_seconds: 720}
  short:     {label: "YouTube Short",    aspect: "9:16", target_seconds: 45,  min_seconds: 30,  max_seconds: 58}
  # "Details you missed" (python -m gta_factory details): made from the footage library, not from articles.
  # The vertical version uses the "short" format: python -m gta_factory details "Trailer 2" --format short
  details:   {label: "Details you missed", aspect: "16:9", target_seconds: 240, min_seconds: 90, max_seconds: 720, footage_only: true}
  # Comparisons and top lists (python -m gta_factory topic "..." [--vs rdr2]); their length follows the number of items.
  versus:    {label: "GTA 6 vs another game", aspect: "16:9", target_seconds: 600, min_seconds: 240, max_seconds: 1800, topic_only: true}
  toplist:   {label: "Top list", aspect: "16:9", target_seconds: 480, min_seconds: 180, max_seconds: 1200, topic_only: true}

script:
  words_per_minute: 165            # used to turn a target duration into a word budget; re-measured after TTS
  max_scene_seconds: 14            # hard ceiling for one visual scene in long-form
  target_scene_seconds: 8
  short_target_scene_seconds: 4
  short_max_scene_seconds: 6        # a Short never holds one card or picture longer than this (long-form: max_scene_seconds)

novelty:
  duplicate_threshold: 0.72        # claim overlap above this = same story
  update_threshold: 0.35           # between update and duplicate = "update" video about the delta only
  min_score_to_produce: 45         # NEWS NOVELTY SCORE (0-100) below this stops the job unless --force
  stale_after_days: 10             # publication older than this is flagged as possibly old news

# ---------------------------------------------------------------------------
# Rendering
# ---------------------------------------------------------------------------
video:
  long:  {width: 1920, height: 1080, fps: 30}
  short: {width: 1080, height: 1920, fps: 30}
  codec: "h264"
  crf: 18
  preset: "medium"
  pixel_format: "yuv420p"
  audio_codec: "aac"
  audio_bitrate: "192k"
  render_concurrency: 0            # 0 = auto (CPU cores - 1; uses the performance cores on Apple Silicon)
  chunk_crf: 14                    # quality of intermediate scene chunks (re-encoded once at the end)
  burn_captions: true

audio:
  sample_rate: 48000
  voice_lufs: -16.0                # narration loudness before the mix
  master_lufs: -14.0               # YouTube reference loudness
  true_peak_db: -1.0
  music_gain_db: -19.0             # bed level under narration
  music_duck_db: -9.0              # extra reduction while the voice is speaking (sidechain)
  sfx_gain_db: -9.0
  scene_gap_seconds: 0.28          # breath between scenes
  short_scene_gap_seconds: 0.12    # Shorts: shorter breaths keep the voice moving
  short_tail_seconds: 0.6          # Shorts: silence after the last word
  short_outro_seconds: 3.0         # Shorts: the end card ("your call") stays this long at least (long-form: 5.5 s)
  short_voice_speed_factor: 1.06   # Shorts: Kokoro reads this much faster than providers.tts.kokoro.speed
  sentence_pause_seconds: 0.24     # breath between two sentences read separately (a bit more after ? and !)
  synthesis: "auto"                # auto: premium voices (elevenlabs, openai) read a whole scene at once for a natural melody
  music_mood: "pulse"              # pulse | tension | drive  (original generated beds in assets/music)

thumbnail:
  width: 1280
  height: 720
  concepts: 3

# ---------------------------------------------------------------------------
# Copyright gate
# ---------------------------------------------------------------------------
rights_review:
  # strict    : only original graphics, licensed stock and assets you supply with a licence sidecar.
  # editorial : additionally allows official Rockstar press material as short, transformed, credited inserts.
  #             Commercial rights for that material are NOT assumed: every such asset is flagged for human review.
  mode: "strict"
  require_license_sidecar_for_user_assets: true
  max_seconds_per_official_clip: 6
  blocked_keywords: ["leak", "leaked", "datamine", "reupload"]


# ---------------------------------------------------------------------------
# Real GTA 6 footage (official trailers + screenshots) behind the motion graphics
# ---------------------------------------------------------------------------
footage:
  enabled: true
  ratio: 0.85                      # target share of the video on real GTA 6 footage (0.85 = 85 %)
  ratio_min: 0.8                   # the edit always lands between ratio_min and ratio_max (80-90 %) when the library has footage
  ratio_max: 0.9                   # the rest stays pure motion graphics (bars, sources, timelines...)
  match_spoken: true               # what the narration SAYS (Lucia, Vice City, the cops, an alligator...) is shown when the library has it
  match_lead_seconds: 0.25         # the matching shot appears this long before the word is said
  photo_share: 0.25                # of the scenes with nothing specific to show, about this share uses a screenshot instead of trailer clips
  photo_hold_seconds: 3.5          # a screenshot inside a scene stays this long
  max_clip_seconds: 6              # longest continuous excerpt of one trailer shot (a scene chains several shots)
  min_piece_seconds: 1.2           # shortest cut
  dir: "assets/gta6_footage"       # videos/ and photos/ inside; drop files there, or `footage add`, or the dashboard
  tags_file: "knowledge/footage_tags.yaml"   # your own characters, places, things the narration can call for
  credit: "Footage: Rockstar Games"
  cookies_from_browser: ""         # age-restricted trailer on YouTube? log into YouTube in a browser and put its name here: chrome, safari, firefox, edge, brave
  thumbnails: true                 # put a real GTA 6 picture behind the thumbnail text
  auto_tag: true                   # look at new footage with a free local vision model (Ollama) to know what is in each shot
  vision_model: "auto"             # auto = qwen2.5vl:7b (16 GB RAM and more) or qwen2.5vl:3b
  sources:                         # official Rockstar uploads downloaded by `footage update` / `footage fetch`
    - "https://www.youtube.com/watch?v=QdBZY2fkU-0"   # Grand Theft Auto VI Trailer 1
    - "https://www.youtube.com/watch?v=VQRLujxTm3c"   # Grand Theft Auto VI Trailer 2
  channels:                        # `footage update` also downloads every NEW official GTA VI video found here
    - "https://www.youtube.com/@RockstarGames/videos"
  title_filter: "Grand Theft Auto VI|GTA VI\\b|GTA 6\\b"   # which videos of those channels count as GTA 6 footage
  min_brightness: 28               # shots darker than this (title cards, fades) are skipped
  skip_head_seconds: 3             # trailer logos
  skip_tail_seconds: 10            # end card / rating screen

# ---------------------------------------------------------------------------
# "Details you missed" videos: the vision model finds small details in the footage, the edit
# freezes on each one, zooms in, circles it and names it (python -m gta_factory details)
# ---------------------------------------------------------------------------
details:
  count_short: 5                   # details in a Short
  count_long: 12                   # details in a 16:9 video
  min_shot_seconds: 1.5            # shorter shots are not scanned

# ---------------------------------------------------------------------------
# Comparisons ("GTA 6 vs Red Dead 2") and top lists ("12 things to do on day one"): python -m gta_factory topic
# GTA 6 facts are fact-checked against the sources; what is said about the other game comes from
# knowledge/games/<game>.yaml. The games (gta5, rdr2 ...) are listed in gta_factory/app/config/defaults.yaml
# (section `games`): copy an entry here to change it, or add a new game the same way.
# ---------------------------------------------------------------------------
topic:
  count_long: 10                   # items in a 16:9 video
  count_short: 4                   # items in a Short
  seconds_per_item_long: 42        # narration per item
  seconds_per_item_short: 9
  max_articles: 8                  # sources read: yours (--source) plus the best ones the news search finds

quality_control:
  max_black_seconds: 0.6
  max_static_seconds: 9.0
  max_audio_peak_db: -0.3
  min_voice_over_music_db: 9.0
  max_caption_chars_per_line: 42
  max_caption_cps: 21
  max_duration_drift_seconds: 0.6

youtube:
  upload_enabled: false            # stays false until you opt in; the package is always produced for human review first
  default_privacy: "private"       # private | unlisted | public (publish --publish-at always uploads private + scheduled)
  category_id: "20"                # Gaming
  made_for_kids: false
  contains_synthetic_media: false  # YouTube's "altered or synthetic content" flag (realistic people/events); review it
  notify_subscribers: true
  upload_captions: true
  captions_name: "Subtitles"
  add_to_playlist: true            # adds the video to "<playlist_prefix> <format>" (created if missing)
  client_secrets_file: ""          # OAuth "Desktop app" client JSON, or YOUTUBE_CLIENT_SECRETS_FILE in .env
  token_file: ".secrets/youtube_token.json"

dashboard:
  host: "127.0.0.1"
  port: 8600
