[project]
name = "gta6-video-factory"
version = "1.0.0"
description = "Automated, fact-checked GTA 6 news videos: research, script, voice, motion graphics, QC and a YouTube-ready package."
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pyyaml>=6.0",
    "numpy>=1.26",
    "scipy>=1.11",
    "soundfile>=0.12",
    "trafilatura>=1.12",
    "feedparser>=6.0",
    "python-dateutil>=2.9",
    "kokoro-onnx>=0.4",
]

[project.optional-dependencies]
# word-level subtitle timing from the audio itself (recommended)
align = ["faster-whisper>=1.0"]
# JavaScript-only article pages
browser = ["playwright>=1.45"]
# download the official GTA 6 trailers (`python -m gta_factory footage fetch`)
footage = ["yt-dlp>=2024.8"]
# competitor research (public channel listings)
research = ["yt-dlp>=2024.8"]
# paid providers, only if you choose them in config.yaml
anthropic = ["anthropic>=0.70"]
openai = ["openai>=1.50"]
dev = ["pytest>=8", "pillow>=10"]

[project.scripts]
gta-factory = "gta_factory.app.cli.main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["gta_factory*"]

[tool.setuptools.package-data]
gta_factory = ["**/*.yaml", "**/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["render: needs Node + Remotion + Chromium (slow); run with GTA_FACTORY_RENDER_TESTS=1"]
